services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - FB_CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      - FB_MAX_UPLOAD_BYTES=10485760
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
